<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Thread</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="thread-shell" aria-label="Task thread">
      <header class="thread-header">
        <div class="thread-header-title">
          <h1 class="thread-title">Task Thread</h1>
          <p class="thread-subtitle">Send one message to create, update, and cancel multiple tasks.</p>
        </div>
        <button id="reset-thread" class="chip-button" type="button">Reset</button>
      </header>

      <section
        id="thread"
        class="thread"
        aria-label="Conversation thread"
        aria-live="polite"
        aria-relevant="additions"
      ></section>

      <form id="composer" class="composer" aria-label="Message composer">
        <label class="sr-only" for="user-input">Message</label>
        <textarea
          id="user-input"
          class="composer-input"
          placeholder="Type a request (e.g. create 3 tasks, update one, cancel another)..."
          rows="2"
        ></textarea>
        <div class="composer-actions">
          <p id="composer-feedback" class="feedback" role="status" aria-live="polite"></p>
          <button id="send-message" class="action-button" type="submit">Send</button>
        </div>
        <p id="thread-error" class="feedback feedback-error" role="alert"></p>
      </form>
    </main>

    <button
      id="json-toggle"
      class="json-toggle"
      type="button"
      aria-label="Toggle JSON panel"
      aria-expanded="false"
      aria-controls="json-panel"
    >
      JSON
    </button>

    <aside id="json-panel" class="json-panel" aria-label="JSON panel" aria-hidden="true">
      <header class="json-panel-header">
        <h2 class="json-panel-title">JSON objects</h2>
        <button id="json-close" class="chip-button" type="button">Close</button>
      </header>
      <pre id="json-output" class="json-output" aria-label="Latest JSON output"></pre>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
